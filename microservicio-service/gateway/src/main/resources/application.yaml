server:
  port: 8080

spring:
  application:
    name: gateway

  cloud:
    gateway:
      mvc:
        routes:
          - id: comunas
            uri: http://localhost:8083
            predicates:
              - Path=/api/v1/comunas/**

          - id: mascotas
            uri: http://localhost:8081
            predicates:
              - Path=/api/v1/mascotas/**

          - id: duenios
            uri: http://localhost:8082
            predicates:
              - Path=/api/v1/duenios/**

          - id: refugios
            uri: http://localhost:8084
            predicates:
              - Path=/api/v1/refugios/**

          - id: veterinarias
            uri: http://localhost:8085
            predicates:
              - Path=/api/v1/veterinarias/**

          - id: reporte-avistamiento
            uri: http://localhost:8086
            predicates:
              - Path=/api/v1/reporte-avistamiento/**

          - id: reporte-desaparicion
            uri: http://localhost:8087
            predicates:
              - Path=/api/v1/reporte-desaparicion/**

          - id: detalles-encuentro
            uri: http://localhost:8088
            predicates:
              - Path=/api/v1/detalles-encuentro/**

          - id: historial-mascota
            uri: http://localhost:8089
            predicates:
              - Path=/api/v1/historial-mascota/**

          - id: halladores
            uri: http://localhost:8091
            predicates:
              - Path=/api/v1/halladores/**
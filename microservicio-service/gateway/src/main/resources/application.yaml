server:
  port: 8080

spring:
  application:
    name: gateway

  cloud:
    gateway:
      mvc:
        routes:
          - id: comunas
            uri: http://comuna-service:8083
            predicates:
              - Path=/api/v1/comunas/**

          - id: mascotas
            uri: http://mascota-service:8081
            predicates:
              - Path=/api/v1/mascotas/**

          - id: duenios
            uri: http://duenio-service:8095
            predicates:
              - Path=/api/v1/duenios/**

          - id: refugios
            uri: http://refugio-service:8084
            predicates:
              - Path=/api/v1/refugios/**

          - id: veterinarias
            uri: http://veterinaria-service:8085
            predicates:
              - Path=/api/v1/veterinarias/**

          - id: reporte-avistamiento
            uri: http://reporte-avistamiento-service:8086
            predicates:
              - Path=/api/v1/reporte-avistamiento/**

          - id: reporte-desaparicion
            uri: http://reporte-desaparicion-service:8087
            predicates:
              - Path=/api/v1/reporte-desaparicion/**

          - id: detalles-encuentro
            uri: http://detalles-encuentro-service:8088
            predicates:
              - Path=/api/v1/detalles-encuentro/**

          - id: historial-mascota
            uri: http://historial-mascota-service:8089
            predicates:
              - Path=/api/v1/historial-mascota/**

          - id: halladores
            uri: http://hallador-service:8091
            predicates:
              - Path=/api/v1/halladores/**

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
# docker-compose.yml
services:
  eureka-server:
    build:
      context: ./microservicio-service/eureka-server
    ports:
      - "8761:8761"
    networks:
      - microservicios-net

  gateway:
    build:
      context: ./microservicio-service/gateway
    ports:
      - "8080:8080"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      - eureka-server
    networks:
      - microservicios-net

  comuna-service:
    build:
      context: ./microservicio-service/comuna-service
    ports:
      - "8081:8081"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      - eureka-server
    networks:
      - microservicios-net

  detalles-encuentro-service:

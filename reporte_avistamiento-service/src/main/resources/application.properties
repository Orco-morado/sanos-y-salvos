# Nombre del microservicio para identificarlo
spring.application.name=reporte_avistamiento-service
server.port=8086
# La tabla de Flyway DEBE ser única para cada microservicio
# Así evitas el error de "checksum mismatch" con otros servicios
spring.flyway.table=flyway_schema_avistamiento

# URL de la BD con el truco "?createDatabaseIfNotExist=true" para evitar errores
# lo investigue despues de unos errores al ejecutarlo con la base de datos con otro nombre
spring.datasource.url=jdbc:mysql://localhost:3306/sanos_y_salvos?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# para que Flyway siempre encuentre los V1, V2, etc. esto lo busque por unos errores, saltaba el v1
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true